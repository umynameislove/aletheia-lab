name: ci

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Matrix job — runs full pytest and strict mypy on every supported Python.
  # Cache key includes python-version so each interpreter gets its own cache.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Type-check (strict)
        run: python -m mypy --strict --python-version ${{ matrix.python-version }} src/aletheia_lab/data src/aletheia_lab/baseline

  # ---------------------------------------------------------------------------
  # Quality job — lint and hygiene run once (not per-version).
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Repo hygiene
        run: python scripts/check_repo_hygiene.py
