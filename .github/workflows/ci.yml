name: ci

on:
  # Feature commits are validated by the pull-request event. Running the same
  # commit again through push would duplicate every matrix job.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Matrix job — runs full pytest and strict mypy on every supported Python.
  # Cache key includes python-version so each interpreter gets its own cache.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          # Registered protocol tests verify that frozen implementation commits
          # are ancestors of the candidate under test.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test architecture and maintainability contracts
        run: python scripts/run_test_profile.py contract
      - name: Prepare pinned test dataset
        run: python scripts/download_dataset.py all --config configs/project.yaml
      - name: Test evaluation reproducibility
        if: matrix.python-version == '3.11'
        run: python scripts/run_test_profile.py evaluation --repeat 3
      - name: Test evaluation interpreter compatibility
        if: matrix.python-version == '3.12'
        run: python scripts/run_test_profile.py evaluation
      - name: Test with blocking coverage
        if: matrix.python-version == '3.11'
        run: >-
          pytest --durations=20
          --cov=aletheia_lab --cov-report=term-missing --cov-fail-under=88
      - name: Test interpreter compatibility
        if: matrix.python-version == '3.12'
        run: pytest --durations=20
      - name: Type-check (strict)
        run: >-
          python -m mypy --strict --python-version ${{ matrix.python-version }}
          src/aletheia_lab/__init__.py
          src/aletheia_lab/__main__.py
          src/aletheia_lab/cli.py
          src/aletheia_lab/config.py
          src/aletheia_lab/filesystem.py
          src/aletheia_lab/baseline
          src/aletheia_lab/data
          src/aletheia_lab/benchmark
          src/aletheia_lab/context
          src/aletheia_lab/diagnosis
          src/aletheia_lab/evidence
          src/aletheia_lab/evaluation
          src/aletheia_lab/model_gateway
          src/aletheia_lab/project
          src/aletheia_lab/reporting
          --exclude src/aletheia_lab/benchmark/p2

  # Windows has distinct DirEntry/lstat/fstat identity semantics.  Keep the
  # project boundary portable without duplicating the full Linux matrix.
  windows-project:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test Windows project boundary
        run: python scripts/run_test_profile.py project -- --durations=20
      - name: Prepare pinned test dataset
        run: python scripts/download_dataset.py all --config configs/project.yaml
      - name: Test Windows evaluation boundary
        run: python scripts/run_test_profile.py evaluation
      - name: Test Windows filesystem publication
        run: python scripts/run_test_profile.py windows-publication

  # ---------------------------------------------------------------------------
  # Quality job — lint and hygiene run once (not per-version).
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test evaluation guard mutations
        run: python scripts/run_evaluation_mutation_audit.py
      - name: Enforce maintainability budgets
        run: python scripts/check_maintainability.py
      - name: Repo hygiene
        run: python scripts/check_repo_hygiene.py

  # ---------------------------------------------------------------------------
  # Security job — static analysis blocks on medium/high severity and confidence.
  # Scans only src/aletheia_lab; never .venv, generated artifacts or datasets.
  # ---------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Static security analysis
        run: python -m bandit -r src/aletheia_lab -ll -ii
