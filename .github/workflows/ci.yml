name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Matrix job — runs full pytest and strict mypy on every supported Python.
  # Cache key includes python-version so each interpreter gets its own cache.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Prepare pinned test dataset
        run: python scripts/download_dataset.py all --config configs/project.yaml
      - name: Test
        run: pytest --cov=aletheia_lab --cov-report=term-missing --cov-fail-under=88
      - name: Type-check (strict)
        run: python -m mypy --strict --python-version ${{ matrix.python-version }} src/aletheia_lab/data src/aletheia_lab/baseline

  # ---------------------------------------------------------------------------
  # Quality job — lint and hygiene run once (not per-version).
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Repo hygiene
        run: python scripts/check_repo_hygiene.py

  # ---------------------------------------------------------------------------
  # Security job — static analysis blocks on medium/high severity and confidence.
  # Scans only src/aletheia_lab; never .venv, generated artifacts or datasets.
  # ---------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Static security analysis
        run: python -m bandit -r src/aletheia_lab -ll -ii
