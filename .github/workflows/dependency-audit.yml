name: dependency-audit

on:
  push:
    paths:
      - pyproject.toml
      - .github/workflows/dependency-audit.yml
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/dependency-audit.yml
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"  # weekly: every Monday at 02:00 UTC

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Audit resolved dependencies for known vulnerabilities.
  # Installs from the project environment (.[dev]) so the audit reflects the
  # exact set of packages used in CI, not a synthetic requirements file.
  # ---------------------------------------------------------------------------
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Audit dependencies
        run: python -m pip_audit
